spring.application.name=url-shortener
server.port=9000

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Redis connection
spring.redis.host=localhost       # or 'redis' if using Docker Compose service name
spring.redis.port=6379
spring.redis.password=            # leave empty if no password
spring.redis.timeout=60000

# Optional: connection pool settings
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1

# ===============================
# Apache Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.linger-ms=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.compression-type=snappy
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.session-timeout-ms=30000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# ===============================
# Application Kafka Topic Configuration
# ===============================
app.kafka.topic.analytics=analytics-topic
